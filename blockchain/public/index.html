<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keralis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .system-status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-up {
            background-color: #28a745;
        }
        .status-down {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Keralis Dashboard</h1>

        <!-- Informations Système -->
        <div class="system-status">
            <h3>État du Système</h3>
            <div class="row" id="systemInfo">
                <div class="col-md-6">
                    <h4>Ressources</h4>
                    <p>CPU: <span id="cpuLoad">-</span></p>
                    <p>Mémoire: <span id="memoryUsage">-</span></p>
                    <p>Disque: <span id="diskUsage">-</span></p>
                </div>
                <div class="col-md-6">
                    <h4>Services</h4>
                    <p>
                        SFTP: 
                        <span class="status-indicator" id="sftpStatusIndicator"></span>
                        <span id="sftpStatus">-</span>
                    </p>
                    <p>Hostname: <span id="hostname">-</span></p>
                    <p>Uptime: <span id="uptime">-</span></p>
                </div>
            </div>
        </div>

        <!-- Statistiques des Collections -->
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Hash</h5>
                        <p class="card-text" id="hashCount">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Encrypted</h5>
                        <p class="card-text" id="encryptedCount">-</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Messages</h5>
                        <p class="card-text" id="messagesCount">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <p>Dernière mise à jour: <span id="lastUpdated">-</span></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function formatUptime(seconds) {
            const days = Math.floor(seconds / (24 * 60 * 60));
            const hours = Math.floor((seconds % (24 * 60 * 60)) / (60 * 60));
            const minutes = Math.floor((seconds % (60 * 60)) / 60);
            return `${days}j ${hours}h ${minutes}m`;
        }

        function updateSystemInfo(stats) {
            if (stats.system) {
                // CPU
                const cpuLoad = stats.system.cpu.loadAverage[0].toFixed(2);
                document.getElementById('cpuLoad').textContent = `${cpuLoad} (${stats.system.cpu.cpuCount} cœurs)`;

                // Mémoire
                document.getElementById('memoryUsage').textContent = 
                    `${stats.system.memory.usedPercentage}% utilisé`;

                // Disque
                if (stats.system.disk && !stats.system.disk.error) {
                    document.getElementById('diskUsage').textContent = 
                        `${stats.system.disk.percentage} utilisé (${stats.system.disk.available} disponible)`;
                }

                // SFTP
                const sftpIndicator = document.getElementById('sftpStatusIndicator');
                const sftpStatus = document.getElementById('sftpStatus');
                if (stats.system.sftp.running) {
                    sftpIndicator.className = 'status-indicator status-up';
                    sftpStatus.textContent = 'En ligne';
                } else {
                    sftpIndicator.className = 'status-indicator status-down';
                    sftpStatus.textContent = 'Hors ligne';
                }

                // Hostname et Uptime
                document.getElementById('hostname').textContent = stats.system.hostname;
                document.getElementById('uptime').textContent = formatUptime(stats.system.cpu.uptime);
            }

            // Mise à jour des compteurs
            document.getElementById('hashCount').textContent = stats.hash;
            document.getElementById('encryptedCount').textContent = stats.encrypted;
            document.getElementById('messagesCount').textContent = stats.messages;
            document.getElementById('lastUpdated').textContent = stats.lastUpdated;
        }

        socket.on('stats', updateSystemInfo);

        // Demander une mise à jour toutes les 5 secondes
        setInterval(() => {
            socket.emit('requestStats');
        }, 5000);
    </script>
</body>
</html>
