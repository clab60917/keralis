<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Blockchain</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .animate-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.active {
            background-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .status-dot.inactive {
            background-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="p-6 min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
    <div class="max-w-7xl mx-auto">
        <!-- En-tête avec statut -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard Blockchain</h1>
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <div id="connectionStatus" class="status-dot inactive mr-2"></div>
                    <span id="connectionText" class="text-sm text-gray-600">Déconnecté</span>
                </div>
                <div class="text-sm text-gray-500">
                    Dernière mise à jour: <span id="lastUpdated" class="font-medium">-</span>
                </div>
            </div>
        </div>
        
        <!-- Cartes des statistiques -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Fichiers Hash</h2>
                    <i class="fas fa-file-code text-blue-500"></i>
                </div>
                <p class="text-3xl font-bold text-blue-600" id="hashCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="hashTrend" class="font-medium"></span>
                </div>
            </div>
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Fichiers Encrypted</h2>
                    <i class="fas fa-lock text-green-500"></i>
                </div>
                <p class="text-3xl font-bold text-green-600" id="encryptedCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="encryptedTrend" class="font-medium"></span>
                </div>
            </div>
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Messages Blockchain</h2>
                    <i class="fas fa-link text-purple-500"></i>
                </div>
                <p class="text-3xl font-bold text-purple-600" id="messagesCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="messagesTrend" class="font-medium"></span>
                </div>
            </div>
        </div>

        <!-- Graphique d'activité -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Activité des dernières 24 heures</h2>
            <canvas id="activityChart" height="100"></canvas>
        </div>

        <!-- Dernières activités -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Derniers Hash -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Hash</h2>
                    <button onclick="refreshData()" class="text-blue-500 hover:text-blue-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentHash" class="space-y-3"></div>
            </div>

            <!-- Derniers Encrypted -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Encrypted</h2>
                    <button onclick="refreshData()" class="text-green-500 hover:text-green-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentEncrypted" class="space-y-3"></div>
            </div>

            <!-- Derniers Messages -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Messages Blockchain</h2>
                    <button onclick="refreshData()" class="text-purple-500 hover:text-purple-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentMessages" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        let activityChart;
        let previousStats = { hash: 0, encrypted: 0, messages: 0 };
        const socket = io();
        
        // Initialisation du graphique
        function initChart() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            activityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(24).fill('').map((_, i) => moment().subtract(23-i, 'hours').format('HH:mm')),
                    datasets: [{
                        label: 'Hash',
                        data: Array(24).fill(0),
                        borderColor: '#3B82F6',
                        tension: 0.4
                    }, {
                        label: 'Encrypted',
                        data: Array(24).fill(0),
                        borderColor: '#10B981',
                        tension: 0.4
                    }, {
                        label: 'Messages',
                        data: Array(24).fill(0),
                        borderColor: '#8B5CF6',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('connectionStatus');
            const statusText = document.getElementById('connectionText');
            
            if (connected) {
                statusDot.classList.remove('inactive');
                statusDot.classList.add('active');
                statusText.textContent = 'Connecté';
            } else {
                statusDot.classList.remove('active');
                statusDot.classList.add('inactive');
                statusText.textContent = 'Déconnecté';
            }
        }

        function updateTrend(currentValue, previousValue, elementId) {
            const element = document.getElementById(elementId);
            const diff = currentValue - previousValue;
            
            if (diff > 0) {
                element.innerHTML = `<i class="fas fa-arrow-up text-green-500"></i> +${diff} depuis la dernière mise à jour`;
            } else if (diff < 0) {
                element.innerHTML = `<i class="fas fa-arrow-down text-red-500"></i> ${diff} depuis la dernière mise à jour`;
            } else {
                element.innerHTML = `<i class="fas fa-minus text-gray-500"></i> Aucun changement`;
            }
        }

        function updateChart(stats) {
            const currentHour = new Date().getHours();
            
            activityChart.data.datasets[0].data[currentHour] = stats.hash;
            activityChart.data.datasets[1].data[currentHour] = stats.encrypted;
            activityChart.data.datasets[2].data[currentHour] = stats.messages;
            
            activityChart.update();
        }

        function formatTimestamp(timestamp) {
            return moment(timestamp).format('DD/MM/YYYY HH:mm:ss');
        }

        function updateRecentItems(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="text-sm text-gray-500 text-center py-4">Aucune donnée</div>';
                return;
            }
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'text-sm p-3 bg-gray-50 rounded hover:bg-gray-100 transition-colors duration-200';
                
                const fileName = item.filePath ? item.filePath.split('/').pop() : 'N/A';
                const time = item.timestamp ? formatTimestamp(item.timestamp) : 'N/A';
                
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="font-semibold text-gray-700">${fileName}</div>
                        <div class="text-xs text-gray-500">${time}</div>
                    </div>
                `;
                
                container.appendChild(div);
            });
        }

        function refreshData() {
            socket.emit('requestStats');
        }

        // Gestion des événements Socket.IO
        socket.on('connect', () => {
            console.log('Connecté au serveur Socket.IO');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('Déconnecté du serveur');
            updateConnectionStatus(false);
        });

        socket.on('connect_error', (error) => {
            console.error('Erreur de connexion Socket.IO:', error);
            updateConnectionStatus(false);
        });

        socket.on('stats', (stats) => {
            console.log('Réception des statistiques:', stats);
            
            // Mettre à jour les compteurs
            document.getElementById('hashCount').textContent = stats.hash || 0;
            document.getElementById('encryptedCount').textContent = stats.encrypted || 0;
            document.getElementById('messagesCount').textContent = stats.messages || 0;
            
            // Mettre à jour les tendances
            updateTrend(stats.hash, previousStats.hash, 'hashTrend');
            updateTrend(stats.encrypted, previousStats.encrypted, 'encryptedTrend');
            updateTrend(stats.messages, previousStats.messages, 'messagesTrend');
            
            // Mettre à jour le graphique
            updateChart(stats);
            
            // Mettre à jour les listes récentes
            updateRecentItems(stats.recentHash, 'recentHash');
            updateRecentItems(stats.recentEncrypted, 'recentEncrypted');
            updateRecentItems(stats.recentMessages, 'recentMessages');
            
            // Mettre à jour l'horodatage
            document.getElementById('lastUpdated').textContent = stats.lastUpdated || '-';
            
            // Sauvegarder les stats précédentes
            previousStats = {
                hash: stats.hash || 0,
                encrypted: stats.encrypted || 0,
                messages: stats.messages || 0
            };
        });

        // Initialisation
        initChart();
    </script>
</body>
</html>
