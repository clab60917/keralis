<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Blockchain</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            will-change: transform;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }
        .status-dot.active {
            background-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .status-dot.inactive {
            background-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="p-6 min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
    <div class="max-w-7xl mx-auto">
        <!-- En-tête avec statut -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard Blockchain</h1>
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <div id="connectionStatus" class="status-dot inactive mr-2"></div>
                    <span id="connectionText" class="text-sm text-gray-600">Déconnecté</span>
                </div>
                <div class="text-sm text-gray-500">
                    Dernière mise à jour: <span id="lastUpdated" class="font-medium">-</span>
                </div>
            </div>
        </div>
        
        <!-- Cartes des statistiques -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Fichiers Hash</h2>
                    <i class="fas fa-file-code text-blue-500"></i>
                </div>
                <p class="text-3xl font-bold text-blue-600" id="hashCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="hashTrend" class="font-medium"></span>
                </div>
            </div>
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Fichiers Encrypted</h2>
                    <i class="fas fa-lock text-green-500"></i>
                </div>
                <p class="text-3xl font-bold text-green-600" id="encryptedCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="encryptedTrend" class="font-medium"></span>
                </div>
            </div>
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Messages Blockchain</h2>
                    <i class="fas fa-link text-purple-500"></i>
                </div>
                <p class="text-3xl font-bold text-purple-600" id="messagesCount">0</p>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="messagesTrend" class="font-medium"></span>
                </div>
            </div>
        </div>

        <!-- Graphique d'activité -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Activité des dernières 24 heures</h2>
            <canvas id="activityChart" height="100"></canvas>
        </div>

        <!-- Dernières activités -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Derniers Hash -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Hash</h2>
                    <button onclick="refreshData()" class="text-blue-500 hover:text-blue-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentHash" class="space-y-3"></div>
            </div>

            <!-- Derniers Encrypted -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Encrypted</h2>
                    <button onclick="refreshData()" class="text-green-500 hover:text-green-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentEncrypted" class="space-y-3"></div>
            </div>

            <!-- Derniers Messages -->
            <div class="card bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-700">Derniers Messages Blockchain</h2>
                    <button onclick="refreshData()" class="text-purple-500 hover:text-purple-700">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentMessages" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // Cache des éléments DOM fréquemment utilisés
        const elements = {
            connectionStatus: document.getElementById('connectionStatus'),
            connectionText: document.getElementById('connectionText'),
            lastUpdated: document.getElementById('lastUpdated'),
            hashCount: document.getElementById('hashCount'),
            encryptedCount: document.getElementById('encryptedCount'),
            messagesCount: document.getElementById('messagesCount'),
            hashTrend: document.getElementById('hashTrend'),
            encryptedTrend: document.getElementById('encryptedTrend'),
            messagesTrend: document.getElementById('messagesTrend'),
            recentHash: document.getElementById('recentHash'),
            recentEncrypted: document.getElementById('recentEncrypted'),
            recentMessages: document.getElementById('recentMessages')
        };

        let activityChart;
        let previousStats = { hash: 0, encrypted: 0, messages: 0 };
        let refreshTimeout = null;
        
        const socket = io({
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });

        function initChart() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            const initialData = Array(24).fill(0);
            
            activityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(24).fill('').map((_, i) => moment().subtract(23-i, 'hours').format('HH:mm')),
                    datasets: [{
                        label: 'Hash',
                        data: [...initialData],
                        borderColor: '#3B82F6',
                        tension: 0.4,
                        fill: false
                    }, {
                        label: 'Encrypted',
                        data: [...initialData],
                        borderColor: '#10B981',
                        tension: 0.4,
                        fill: false
                    }, {
                        label: 'Messages',
                        data: [...initialData],
                        borderColor: '#8B5CF6',
                        tension: 0.4,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 12
                            }
                        }
                    }
                }
            });
        }

        let lastUpdateHour = new Date().getHours();

        function updateConnectionStatus(connected) {
            elements.connectionStatus.classList.toggle('active', connected);
            elements.connectionStatus.classList.toggle('inactive', !connected);
            elements.connectionText.textContent = connected ? 'Connecté' : 'Déconnecté';
        }

        function updateTrend(currentValue, previousValue, elementId) {
            const element = document.getElementById(elementId);
            const diff = currentValue - previousValue;
            
            let html;
            if (diff > 0) {
                html = `<i class="fas fa-arrow-up text-green-500"></i> +${diff} depuis la dernière mise à jour`;
            } else if (diff < 0) {
                html = `<i class="fas fa-arrow-down text-red-500"></i> ${diff} depuis la dernière mise à jour`;
            } else {
                html = `<i class="fas fa-minus text-gray-500"></i> Aucun changement`;
            }
            
            if (element.innerHTML !== html) {
                element.innerHTML = html;
            }
        }

        function updateChart(stats) {
            const currentHour = new Date().getHours();
            
            // Ne mettre à jour que si l'heure a changé
            if (currentHour !== lastUpdateHour) {
                // Mettre à jour les données
                activityChart.data.datasets.forEach(dataset => {
                    dataset.data.shift(); // Enlever la première valeur
                    dataset.data.push(0); // Ajouter un nouveau point à 0
                });
                
                // Mettre à jour les labels
                activityChart.data.labels = Array(24).fill('').map((_, i) => 
                    moment().subtract(23-i, 'hours').format('HH:mm')
                );
                
                lastUpdateHour = currentHour;
            }
            
            // Mettre à jour le dernier point avec les valeurs actuelles
            activityChart.data.datasets[0].data[23] = stats.hash;
            activityChart.data.datasets[1].data[23] = stats.encrypted;
            activityChart.data.datasets[2].data[23] = stats.messages;
            
            activityChart.update();
        }

        const formatTimestamp = (() => {
            const cache = new Map();
            return (timestamp) => {
                if (!timestamp) return 'N/A';
                if (cache.has(timestamp)) return cache.get(timestamp);
                const formatted = moment(timestamp).format('DD/MM/YYYY HH:mm:ss');
                cache.set(timestamp, formatted);
                return formatted;
            };
        })();

        function updateRecentItems(items, containerId) {
            const container = elements[containerId];
            if (!container) return;

            const fragment = document.createDocumentFragment();
            
            if (!items || items.length === 0) {
                const div = document.createElement('div');
                div.className = 'text-sm text-gray-500 text-center py-4';
                div.textContent = 'Aucune donnée';
                fragment.appendChild(div);
            } else {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'text-sm p-3 bg-gray-50 rounded hover:bg-gray-100 transition-colors duration-200';
                    
                    const fileName = item.filePath ? item.filePath.split('/').pop() : 'N/A';
                    const time = formatTimestamp(item.timestamp);
                    
                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="font-semibold text-gray-700">${fileName}</div>
                            <div class="text-xs text-gray-500">${time}</div>
                        </div>
                    `;
                    
                    fragment.appendChild(div);
                });
            }
            
            // Seulement mettre à jour si le contenu a changé
            if (container.innerHTML !== fragment.innerHTML) {
                container.innerHTML = '';
                container.appendChild(fragment);
            }
        }

        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        const refreshData = throttle(() => {
            socket.emit('requestStats');
        }, 2000);

        socket.on('connect', () => {
            console.log('Connecté au serveur Socket.IO');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('Déconnecté du serveur');
            updateConnectionStatus(false);
        });

        socket.on('connect_error', (error) => {
            console.error('Erreur de connexion Socket.IO:', error);
            updateConnectionStatus(false);
        });

        socket.on('stats', (stats) => {
            // Mettre à jour les compteurs
            elements.hashCount.textContent = stats.hash || 0;
            elements.encryptedCount.textContent = stats.encrypted || 0;
            elements.messagesCount.textContent = stats.messages || 0;
            
            // Mettre à jour les tendances
            updateTrend(stats.hash, previousStats.hash, 'hashTrend');
            updateTrend(stats.encrypted, previousStats.encrypted, 'encryptedTrend');
            updateTrend(stats.messages, previousStats.messages, 'messagesTrend');
            
            // Mettre à jour le graphique
            requestAnimationFrame(() => updateChart(stats));
            
            // Mettre à jour les listes récentes
            updateRecentItems(stats.recentHash, 'recentHash');
            updateRecentItems(stats.recentEncrypted, 'recentEncrypted');
            updateRecentItems(stats.recentMessages, 'recentMessages');
            
            // Mettre à jour l'horodatage
            elements.lastUpdated.textContent = stats.lastUpdated || '-';
            
            // Sauvegarder les stats précédentes
            previousStats = {
                hash: stats.hash || 0,
                encrypted: stats.encrypted || 0,
                messages: stats.messages || 0
            };
        });

        // Initialisation
        initChart();
    </script>
</body>
</html>
